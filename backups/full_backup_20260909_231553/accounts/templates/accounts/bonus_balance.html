{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bonus Balance - YN Commerce India</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .header {
            background: #111827;
            color: white;
            padding: 18px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .container {
            max-width: 700px;
            margin: 25px auto;
            padding: 0 16px;
        }

        .balance-card {
            background: white;
            border-radius: 18px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .balance-label {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .balance {
            font-size: 38px;
            font-weight: bold;
            margin: 0;
        }

        .info-card {
            background: white;
            margin-top: 18px;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.06);
        }

        .info-card h2 {
            margin-top: 0;
            font-size: 18px;
        }

        .info-card p {
            color: #6b7280;
            line-height: 1.6;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }

        .back-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>YN Commerce India</h1>
    </div>

    <div class="container">

        <div class="balance-card">
            <div class="balance-label">
                Bonus Balance
            </div>

            <p class="balance">
                ₹{{ bonus_balance|default:"0.00"|floatformat:2 }}
            </p>
        </div>

        <div class="info-card">
            <h2>Bonus Balance</h2>

            <p>
                यह आपका वर्तमान MLM bonus/commission balance है।
            </p>

            <p>
                Bonus amount आपके account में उपलब्ध balance के अनुसार
                यहाँ दिखाई देगा।
            </p>
        </div>

        <a href="{% url 'home' %}" class="back-btn">
            ← Back to Home
        </a>

    </div>

</body>
</html>
