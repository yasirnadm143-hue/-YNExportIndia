<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: inline-block;
            margin-bottom: 15px;
            text-decoration: none;
        }

        .messages {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <a class="back" href="{% url 'seller_dashboard' %}">← Seller Dashboard</a>

    <h1>Add Product</h1>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label for="title">Product Title</label>
        <input
            type="text"
            id="title"
            name="title"
            maxlength="200"
            required
        >

        <label for="description">Description</label>
        <textarea
            id="description"
            name="description"
            required
        ></textarea>

        <label for="price">Price</label>
        <input
            type="number"
            id="price"
            name="price"
            step="0.01"
            min="0.01"
            required
        >

        <label for="category">Category</label>
        <select id="category" name="category">
            <option value="">Select Category</option>

            {% for category in categories %}
                <option value="{{ category.id }}">
                    {{ category.name }}
                </option>
            {% endfor %}
        </select>

        <label for="subcategory">Subcategory</label>
        <select id="subcategory" name="subcategory">
            <option value="">Select Subcategory</option>
        </select>

        <label for="brand">Brand</label>
        <select id="brand" name="brand">
            <option value="">Select Brand</option>

            {% for brand in brands %}
                <option value="{{ brand.id }}">
                    {{ brand.name }}
                </option>
            {% endfor %}
        </select>

        <label for="image">Main Product Image</label>
        <input
            type="file"
            id="image"
            name="image"
            accept="image/*"
        >

        <label for="images">📸 Product Gallery - Multiple Images</label>
        <input
            type="file"
            id="images"
            name="images"
            accept="image/*"
            multiple
        >

        <div id="imageCount"
             style="margin-top:8px;padding:10px;background:#eef5ff;border-radius:8px;color:#0d47a1;">
            Select multiple images for this product
        </div>

        <small style="display:block;margin-top:8px;color:#666;">
            You can select 2, 3, 5, 10 or more images at the same time.
            All selected images will stay attached to this one product.
        </small>

        <button type="submit">Add Product</button>
    </form>

</div>


<script>
document.getElementById("images").addEventListener("change", function () {
    const count = this.files.length;
    const box = document.getElementById("imageCount");

    if (count === 0) {
        box.textContent = "Select multiple images for this product";
    } else {
        box.textContent = "✅ " + count + " gallery image(s) selected";
    }
});
</script>

</body>
</html>
