<!DOCTYPE html>
<html>
<head>
    <title>Place Order</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:linear-gradient(135deg,#1e3c72,#2a5298);
            padding:30px;
        }

        .container{
            max-width:700px;
            margin:auto;
            background:#fff;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,.3);
        }

        .top{
            padding:20px;
            text-align:center;
            background:#0d47a1;
            color:#fff;
        }

        img{
            width:100%;
            height:320px;
            object-fit:cover;
        }

        .content{
            padding:25px;
        }

        h2{
            color:#0d47a1;
            margin-bottom:10px;
        }

        .price{
            font-size:30px;
            color:green;
            font-weight:bold;
            margin:15px 0;
        }

        p{
            color:#555;
            margin-bottom:20px;
            line-height:1.6;
        }

        input{
            width:100%;
            padding:13px;
            margin:8px 0;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:15px;
            background:#ff6600;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            margin-top:15px;
        }

        button:hover{
            background:#e65100;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top">
        <h1>🛒 Place Your Order</h1>
    </div>

    <img src="{{ product.image.url }}" alt="">

    <div class="content">

        <h2>{{ product.title }}</h2>

        <div class="price">
            ₹ {{ product.price }}
        </div>

        <p>{{ product.description }}</p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                ✅ Confirm Order
            </button>

        </form>

    </div>

</div>

</body>
</html>
