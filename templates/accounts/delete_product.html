<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Delete Product | YN Commerce India</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#001f3f,#004aad,#0d6efd);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{

    width:90%;
    max-width:500px;
    background:white;
    border-radius:20px;
    padding:35px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.35);

}

.logo{

    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:#0d6efd;
    color:white;
    font-size:40px;
    display:flex;
    justify-content:center;
    align-items:center;

}

h1{

    color:#0d47a1;
    margin-top:20px;

}

h3{

    color:#ff3b30;
    margin-top:15px;

}

p{

    margin-top:15px;
    color:#555;
    line-height:28px;

}

.product{

    color:#0d47a1;
    font-weight:bold;
    font-size:22px;

}

.btn{

    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
    margin-top:20px;

}

.delete{

    background:#dc3545;
    color:white;

}

.delete:hover{

    background:#b02a37;

}

.cancel{

    display:block;
    margin-top:15px;
    text-decoration:none;
    background:#198754;
    color:white;
    padding:15px;
    border-radius:10px;
    font-weight:bold;

}

.cancel:hover{

    background:#146c43;

}

.footer{

    margin-top:25px;
    color:#888;
    font-size:14px;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">
YN
</div>

<h1>YN Commerce India</h1>

<h3>Delete Product</h3>

<p>
Are you sure you want to delete this product?
</p>

<p class="product">
{{ product.title }}
</p>

<form method="POST">

{% csrf_token %}

<button class="btn delete">
🗑 Delete Product
</button>

</form>

<a href="{% url 'product_detail' product.id %}" class="cancel">
⬅ Cancel
</a>

<div class="footer">

© 2026 YN Commerce India

</div>

</div>

</body>
</html>
