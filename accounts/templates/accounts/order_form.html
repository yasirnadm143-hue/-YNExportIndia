<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Order - YN Export India</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f1f3f6; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #2874f0; text-align: center; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .btn { width: 100%; padding: 12px; background: #fb641b; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Shipping Details</h2>
        <p style="font-size:14px; color:#555;"><strong>Product:</strong> {{ product.title }} (₹ {{ product.price }})</p>
        <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" required placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" name="mobile_number" required placeholder="10-digit mobile number">
            </div>
            <div class="form-group">
                <label>Pincode</label>
                <input type="text" name="pincode" required placeholder="6-digit pincode">
            </div>
            <div class="form-group">
                <label>State</label>
                <input type="text" name="state" required placeholder="e.g. Maharashtra">
            </div>
            <div class="form-group">
                <label>District / City</label>
                <input type="text" name="district" required placeholder="e.g. Mumbai">
            </div>
            <div class="form-group">
                <label>Full Address (House No, Street, Landmark)</label>
                <textarea name="address" rows="2" required placeholder="Complete address..."></textarea>
            </div>
            <div class="form-group">
                <label>Quantity</label>
                <input type="number" name="quantity" value="1" min="1" required>
            </div>
            <button type="submit" class="btn">Place Order</button>
        </form>
    </div>
</body>
</html>
