<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support - YN Export India</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f3f6; color: #333; }
        .navbar { background: linear-gradient(135deg, #2874f0, #1251b8); color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .navbar h2 a { color: white; text-decoration: none; font-size: 18px; font-weight: 800; }
        .container { max-width: 600px; margin: 30px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #2874f0; margin-bottom: 20px; font-size: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; color: #555; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        textarea { resize: vertical; height: 120px; }
        .btn-submit { background: #2874f0; color: white; border: none; padding: 12px; width: 100%; font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-submit:hover { background: #1a5ac8; }
        .alert { background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 13px; font-weight: bold; border: 1px solid #c8e6c9; }
        .back-link { display: inline-block; margin-top: 15px; color: #2874f0; text-decoration: none; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>
    <header class="navbar">
        <h2><a href="{% url 'home' %}">YN Export India</a></h2>
        <a href="{% url 'home' %}" style="color: white; text-decoration: none; font-size: 14px; font-weight: bold;">🏠 Home</a>
    </header>
    <div class="container">
        <h2>🛠️ Customer Support & Help Desk</h2>
        {% if messages %}
            {% for message in messages %}
                <div class="alert">✨ {{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Your Registered Email</label>
                <input type="email" name="email" value="{{ request.user.email }}" required>
            </div>
            <div class="form-group">
                <label>Subject / Issue Title</label>
                <input type="text" name="subject" placeholder="e.g. Payment Issue, Order Delay" required>
            </div>
            <div class="form-group">
                <label>Describe Your Problem in Detail</label>
                <textarea name="message" placeholder="Write your issue here..." required></textarea>
            </div>
            <button type="submit" class="btn-submit">Submit Support Ticket</button>
        </form>
        <a href="{% url 'home' %}" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
