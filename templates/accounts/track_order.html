<!DOCTYPE html>
<html>
<head>
    <title>Track Order</title>

    <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:linear-gradient(135deg,#1e3c72,#2a5298);
            padding:30px;
        }

        .card{
            max-width:600px;
            margin:auto;
            background:#fff;
            border-radius:15px;
            padding:25px;
            box-shadow:0 10px 25px rgba(0,0,0,.25);
        }

        h2{
            text-align:center;
            color:#0d47a1;
            margin-bottom:20px;
        }

        p{
            font-size:17px;
            margin:12px 0;
        }

        .status{
            background:#28a745;
            color:#fff;
            padding:10px;
            text-align:center;
            border-radius:8px;
            font-weight:bold;
            margin:20px 0;
        }

        .btn{
            display:block;
            text-align:center;
            text-decoration:none;
            background:#ff6600;
            color:#fff;
            padding:15px;
            border-radius:8px;
            font-weight:bold;
            margin-top:20px;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>📦 Track Your Order</h2>

    <p><strong>Order ID:</strong> {{ order.id }}</p>
    <p><strong>Customer:</strong> {{ order.full_name }}</p>
    <p><strong>Product:</strong> {{ order.product.title }}</p>
    <p><strong>Mobile:</strong> {{ order.mobile }}</p>
    <p><strong>Address:</strong> {{ order.address }}</p>

    <div class="status">
        Order Received
    </div>

    <a href="/" class="btn">🏠 Back to Home</a>

</div>

</body>
</html>
