<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.title }} - YN Commerce India</title>

    <style>

    body{
        font-family:Arial,sans-serif;
        background:#f1f3f6;
        margin:0;
        padding:15px;
    }

    .container{
        max-width:700px;
        margin:auto;
        background:#fff;
        padding:20px;
        border-radius:10px;
        box-shadow:0 2px 10px rgba(0,0,0,.15);
    }

    .img-container{
        text-align:center;
        overflow:hidden;
        border:1px solid #ddd;
        border-radius:8px;
        margin-bottom:15px;
    }

    .product-img{
        width:100%;
        max-height:350px;
        object-fit:contain;
        cursor:pointer;
        transition:.3s;
    }

    .product-img.zoomed{
        transform:scale(1.6);
    }

    h2{
        color:#0d47a1;
    }

    .price{
        color:green;
        font-size:28px;
        font-weight:bold;
        margin:15px 0;
    }

    .desc{
        color:#555;
        line-height:28px;
        margin-bottom:20px;
    }

    .btn{
        display:block;
        width:100%;
        padding:14px;
        text-align:center;
        text-decoration:none;
        color:#fff;
        font-weight:bold;
        border-radius:8px;
        margin-top:12px;
    }

    .order{background:#ff6f00;}
    .edit{background:#0d6efd;}
    .delete{background:#dc3545;}
    .back{background:#198754;}

    </style>

</head>

<body>

<div class="container">

<div class="img-container">

{% if product.image %}
<img src="{{ product.image.url }}"
     class="product-img"
     id="zoomImg"
     onclick="toggleZoom()">
{% else %}
<div style="height:250px;display:flex;align-items:center;justify-content:center;font-size:60px;">
📦
</div>
{% endif %}

</div>

<p align="center">
🔍 Tap Image to Zoom
</p>

<h2>{{ product.title }}</h2>

<div class="price">
₹ {{ product.price }}
</div>

<div class="desc">
{{ product.description }}
</div>
<a href="{% url 'order_product' product.id %}" class="btn order">
🛒 Order Now
</a>

{% if request.user.is_staff or request.user == product.owner %}

<a href="{% url 'edit_product' product.id %}" class="btn edit">
✏ Edit Product
</a>

<a href="{% url 'delete_product' product.id %}" class="btn delete">
🗑 Delete Product
</a>

{% endif %}

<a href="{% url 'home' %}" class="btn back">
🏠 Back To Home
</a>

</div>

<script>

function toggleZoom() {
    document.getElementById("zoomImg").classList.toggle("zoomed");
}

</script>

</body>
</html>
