<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - YN Commerce India</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f1f3f6; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #2874f0; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 18px; text-align: center; letter-spacing: 5px; }
        .btn { width: 100%; padding: 12px; background: #388e3c; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔒 Enter OTP</h2>
        <p style="font-size:14px; color:#666;">Enter the 4-digit OTP sent to your mobile</p>
        
        {% if messages %}
            {% for message in messages %}
                <p style="color:green; font-size:14px; font-weight:bold;">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="otp" placeholder="1234" required maxlength="4">
            <button type="submit" class="btn">Verify & Proceed</button>
        </form>
    </div>
</body>
</html>
