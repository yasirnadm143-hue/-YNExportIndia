<!DOCTYPE html>
<html>
<head>
    <title>Upload Product</title>

    <style>
        body{
            margin:0;
            padding:0;
            font-family:Arial,sans-serif;
            background:linear-gradient(135deg,#0f4c81,#00b894);
        }

        .box{
            width:90%;
            max-width:450px;
            margin:40px auto;
            background:#fff;
            padding:25px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.25);
        }

        h2{
            text-align:center;
            color:#0f4c81;
        }

        input,textarea,select{
            width:100%;
            padding:12px;
            margin-top:10px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:8px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:14px;
            background:#ff6600;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
        }

        button:hover{
            background:#e65100;
        }

        .msg{
            background:#d4edda;
            color:#155724;
            padding:10px;
            border-radius:8px;
            margin-bottom:15px;
        }
    </style>

</head>

<body>

<div class="box">

<h2>📦 Upload Product</h2>

{% if messages %}
{% for message in messages %}
<div class="msg">{{ message }}</div>
{% endfor %}
{% endif %}

<form method="POST" enctype="multipart/form-data">
{% csrf_token %}
{{ form.as_p }}

<button type="submit">
Upload Product
</button>

</form>

</div>

</body>
</html>
