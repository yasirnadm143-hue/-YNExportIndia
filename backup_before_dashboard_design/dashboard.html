<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - YN Export India</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 12px;
            font-family: Arial, sans-serif;
            background: #eef3f8;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            color: #0868b8;
            font-size: 28px;
        }

        .welcome {
            margin-top: 8px;
            color: #666;
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .card {
            background: white;
            padding: 22px 15px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,.07);
        }

        .number {
            font-size: 34px;
            font-weight: 800;
            color: #0868b8;
            margin-bottom: 8px;
        }

        .title {
            font-size: 16px;
            font-weight: 700;
            color: #444;
        }

        .referral {
            margin-top: 18px;
            background: #eaf7ff;
            padding: 18px;
            border-radius: 16px;
            text-align: center;
        }

        .referral strong {
            color: #0868b8;
            font-size: 20px;
        }

        .links {
            margin-top: 20px;
            display: grid;
            gap: 10px;
        }

        .links a {
            display: block;
            padding: 14px;
            background: white;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            color: #0868b8;
            font-weight: 700;
        }

        @media (max-width: 450px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>YN Export India</h1>

        <div class="welcome">
            Welcome, {{ user.first_name|default:user.username }}
        </div>
    </div>

    <div class="cards">

        <div class="card">
            <div class="number">{{ direct_team }}</div>
            <div class="title">Direct Team</div>
        </div>

        <div class="card">
            <div class="number">{{ total_team }}</div>
            <div class="title">Total Team</div>
        </div>

    </div>

    <div class="referral">
        Your Referral ID<br><br>
        <strong>{{ user.referral_id }}</strong>
    </div>

    <div class="links">

        <a href="{% url 'profile' %}">
            👤 My Profile
        </a>

        <a href="{% url 'wallet_view' %}">
            💰 Wallet
        </a>

        <a href="{% url 'home' %}">
            🏠 Home
        </a>

        <a href="{% url 'logout' %}">
            🚪 Logout
        </a>

    </div>

</div>

</body>
</html>
